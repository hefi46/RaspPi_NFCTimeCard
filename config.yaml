database:
  path: ./timecard.db          # change to /var/lib/timecard/timecard.db on Pi

server:
  host: 127.0.0.1              # change to 0.0.0.0 on Pi for LAN access
  port: 5000
  secret_key: CHANGE_ME        # replace with a long random string before deploying

hardware:
  mock: true                   # set false on Pi with real hardware
  nfc:
    interface: spi
    reset_pin: 20
    req_pin: 16
  tft:                         # 2.8" ILI9341 320×240 colour TFT (SPI)
    cs_pin: 8
    dc_pin: 25
    rst_pin: 24
    rotation: 90
    baudrate: 64000000
  buzzer:
    gpio_pin: 18
