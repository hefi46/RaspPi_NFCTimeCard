database:
  path: /var/lib/timecard/timecard.db

server:
  host: 0.0.0.0
  port: 5000
  secret_key: CHANGE_ME   # replace with a long random string before deploying

hardware:
  mock: false             # set true on a dev machine without physical hardware
  nfc:
    interface: spi        # spi | i2c | uart
    reset_pin: 20
    req_pin: 16
  tft:                    # 2.8" ILI9341 320×240 colour TFT (SPI)
    cs_pin: 8             # SPI CE0 / GPIO8
    dc_pin: 25            # data/command GPIO25
    rst_pin: 24           # reset GPIO24
    rotation: 90          # landscape orientation
    baudrate: 64000000
  buzzer:
    gpio_pin: 18
